@if(productsResourceBySlug.isLoading()){
<div class="flex justify-center items-center h-screen">
    <span class="loading loading-spinner loading-lg"></span>
</div>
}

@if (productsResourceBySlug.hasValue()) {
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

    <p>Imágenes</p>
<product-carousel [images]="productsResourceBySlug.value().images"></product-carousel>

    <div>
        <h2 class="text-2xl font-bold font-Montserrat">
            {{productsResourceBySlug.value().title}}
        </h2>

        <div class="divider"></div>

        <p>
            {{productsResourceBySlug.value().description}}
        </p>

    </div>
</div>

}
